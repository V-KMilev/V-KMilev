# Draws the contribution graph being eaten by a snake, in the engine's red, into the output branch.
name: snake

on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#dc3c3c
            dist/snake-dark.svg?palette=github-dark&color_snake=#dc3c3c

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -q -m "snake"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
